[package]
name = "auspex-core"
version = "0.2.0-rc.1"
edition = "2024"
description = "Core logic, types, and state machines for Auspex — the operator shell for Omegon"
license = "MIT"
repository = "https://github.com/styrene-lab/auspex"

[package.metadata.omegon]
minimum_version = "0.25.0"
maximum_tested_version = "0.26.0"
control_plane_schema = 2

[features]
default = ["desktop"]
desktop = [
    "dep:tokio-tungstenite",
    "dep:rpkl",
    "dep:styrene-a2a",
    "dep:styrene-mqtt",
    "tokio/process",
    "tokio/io-util",
    "tokio/net",
]
web = [
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:gloo-timers",
]

[dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
sha2 = "0.10"
semver = "1"
toml = "0.8"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
tokio-util = "0.7"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
futures-util = "0.3"
tungstenite = { version = "0.28", default-features = false }
rmp-serde = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
omegon-traits = "0.20"
styrene-policy = { path = "../../worktrees/styrene-rs-policy/crates/libs/styrene-policy", features = ["config"] }

# Desktop MQTT A2A bridge; mesh routing remains a separate adapter.
styrene-a2a = { path = "../../styrene-rs/crates/libs/styrene-a2a", optional = true }
styrene-mqtt = { path = "../../styrene-rs/crates/libs/styrene-mqtt", optional = true }

# Desktop-only: async WebSocket via tokio
tokio-tungstenite = { version = "0.28", optional = true, default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Desktop-only: pkl config evaluation
rpkl = { version = "0.8", optional = true }

# Web-only: browser WebSocket via web-sys
web-sys = { version = "0.3", optional = true, features = ["WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType", "Window", "Location", "UrlSearchParams"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bollard = "0.21.0"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustls = "0.23"
rustls-pemfile = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
pretty_assertions = "1"
toml = "0.8"
