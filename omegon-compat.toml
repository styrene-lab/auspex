# Omegon Compatibility Manifest

Auspex targets the revision-pinned Omegon 0.29 decomposition surface. Older monolithic control-plane releases are unsupported rather than degraded.

```toml
[omegon]
minimum_version = "0.29.0-dev"
maximum_tested_version = "0.29.0-dev"
web_startup_schema = 2
instance_descriptor_schema = 1
control_plane_protocol = 1
required_surfaces = [
  "acp.initialize.metadata",
  "nex_capability.read_only",
  "host_action.package_install_v1",
]

[policy]
older_versions = "unsupported"
unknown_host_actions = "deny"
mutating_host_actions = "approval_required"
```

## Purpose

Auspex should not attach blindly to arbitrary Omegon instances. It declares the Omegon release line, control-plane schema, and orchestration surfaces it supports, then verifies those at runtime.

## Current stance

- Minimum Omegon: `0.29.0-dev`
- Maximum tested Omegon: `0.29.0-dev`
- Web startup schema: `2`
- Instance descriptor schema: `1`
- Control-plane protocol/schema: `1`
- Older Omegon versions are unsupported.

## Rationale

The native integration depends on the canonical Omegon 0.29 surfaces:

- `omegon serve` startup and readiness discovery;
- versioned MessagePack IPC with capability negotiation;
- generation-aware session snapshots, queue state, and lag reconciliation.

Maintaining compatibility shims for pre-decomposition instances would preserve competing sources of session authority. Auspex should fail clearly instead.
