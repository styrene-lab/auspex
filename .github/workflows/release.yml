name: Release Auspex desktop binary

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.1.0-rc.1). Must already exist on origin.'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  build:
    name: Build macOS arm64 release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Read pinned Omegon runtime metadata
        id: omegon
        run: python3 scripts/omegon_runtime_metadata.py --format github-output >> "$GITHUB_OUTPUT"

      - name: Check out pinned Omegon release source
        uses: actions/checkout@v4
        with:
          repository: styrene-lab/omegon
          ref: ${{ steps.omegon.outputs.omegon_revision }}
          path: omegon

      - name: Verify pinned revision belongs to the declared release branch
        working-directory: omegon
        env:
          OMEGON_BRANCH: ${{ steps.omegon.outputs.omegon_branch }}
          OMEGON_REVISION: ${{ steps.omegon.outputs.omegon_revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${OMEGON_BRANCH}:refs/remotes/origin/${OMEGON_BRANCH}"
          test "$(git rev-parse HEAD)" = "$OMEGON_REVISION"
          git merge-base --is-ancestor "$OMEGON_REVISION" "origin/${OMEGON_BRANCH}"

      - name: Check out styrene-rs sibling for path dependency
        uses: actions/checkout@v4
        with:
          repository: styrene-lab/styrene-rs
          ref: feat/conversations-pages
          path: styrene-rs

      - name: Link Omegon at expected sibling path
        run: |
          ln -sfn "$GITHUB_WORKSPACE/omegon" "$GITHUB_WORKSPACE/../omegon"
          ln -sfn "$GITHUB_WORKSPACE/styrene-rs" "$GITHUB_WORKSPACE/../styrene-rs"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build pinned TUI-free Omegon sidecar
        working-directory: omegon
        env:
          OMEGON_PACKAGE: ${{ steps.omegon.outputs.omegon_package }}
        run: cargo build --release --locked --no-default-features -p "$OMEGON_PACKAGE"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create archive and checksums
        env:
          OMEGON_BINARY: ${{ steps.omegon.outputs.omegon_binary }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TARGET="aarch64-apple-darwin"
          ARCHIVE="auspex-${VERSION}-${TARGET}.tar.gz"
          STAGING="auspex-${VERSION}-${TARGET}"
          test "$OMEGON_BINARY" = "runtime/omegon-headless"
          mkdir -p "$STAGING/runtime"
          install -m 0755 target/release/auspex "$STAGING/auspex"
          install -m 0755 omegon/target/release/omegon "$STAGING/$OMEGON_BINARY"
          OMEGON_SHA256="$(shasum -a 256 "$STAGING/$OMEGON_BINARY" | awk '{print $1}')"
          tar czf "$ARCHIVE" "$STAGING"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "OMEGON_SHA256=$OMEGON_SHA256" >> "$GITHUB_ENV"

      - name: Write sidecar provenance
        env:
          OMEGON_REPOSITORY: ${{ steps.omegon.outputs.omegon_repository }}
          OMEGON_BRANCH: ${{ steps.omegon.outputs.omegon_branch }}
          OMEGON_REVISION: ${{ steps.omegon.outputs.omegon_revision }}
          OMEGON_VERSION: ${{ steps.omegon.outputs.omegon_version }}
          OMEGON_BINARY: ${{ steps.omegon.outputs.omegon_binary }}
        run: |
          python3 - <<'PY'
          import json, os
          provenance = {
              "repository": os.environ["OMEGON_REPOSITORY"],
              "branch": os.environ["OMEGON_BRANCH"],
              "revision": os.environ["OMEGON_REVISION"],
              "version": os.environ["OMEGON_VERSION"],
              "binary": os.environ["OMEGON_BINARY"],
              "sha256": os.environ["OMEGON_SHA256"],
              "cargo_features": [],
              "default_features": False,
          }
          with open("omegon-runtime.json", "w") as output:
              json.dump(provenance, output, indent=2)
              output.write("\n")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-arm64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            omegon-runtime.json

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > checksums.sha256
          cat checksums.sha256

      - name: Generate release manifest
        run: |
          python3 scripts/release_manifest.py generate \
            --tag "${RELEASE_TAG}" \
            --checksums artifacts/checksums.sha256 \
            --output artifacts/release-manifest.json \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --omegon-runtime artifacts/omegon-runtime.json
          cat artifacts/release-manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ -rc\.[0-9]+$ ]]; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --prerelease \
              artifacts/*
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              artifacts/*
          fi
