apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: omegon-agents
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    protocol mqtt
    persistence true
    persistence_location /mosquitto/data/
    allow_anonymous true
    max_inflight_messages 64
    max_queued_messages 4096
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: omegon-agents
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  namespace: omegon-agents
spec:
  serviceName: mosquitto
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      securityContext:
        fsGroup: 1883
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          args: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket: { port: mqtt }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: mqtt }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
