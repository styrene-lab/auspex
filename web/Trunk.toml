[build]
target = "index.html"
dist = "../dist"
release = true

[watch]
watch = ["../src", "../auspex-core/src", "../assets"]

[[proxy]]
# Proxy browser API calls to the Auspex local reverse proxy. The proxy owns
# Omegon token discovery and trusted local principal headers; browser code does
# not receive or forward the daemon bearer in this mode.
rewrite = "/api/"
backend = "http://localhost:9311/api/"
